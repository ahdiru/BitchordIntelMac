name: Windows Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (e.g. 1.9.1)"
        required: false
        default: "1.9.1"
      build_number:
        description: "Optional desktop build number (e.g. 31)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    name: Windows · exe, msi, portable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install WiX Toolset 3
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath "$env:RUNNER_TEMP\wix"
          "$env:RUNNER_TEMP\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Create local.properties
        shell: bash
        run: |
          touch local.properties

      - name: Build Windows Packages
        id: build
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version || '1.9.1' }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          $releaseVersion = $env:RELEASE_VERSION
          if ($releaseVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use MAJOR.MINOR.PATCH format."
          }
          $buildNumber = $env:BUILD_NUMBER
          if ($buildNumber -and $buildNumber -notmatch '^\d+$') {
            throw "Build number must contain digits only."
          }
          $appVersion = if ($buildNumber) { "$releaseVersion-build$buildNumber" } else { $releaseVersion }
          "releaseVersion=$releaseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "buildNumber=$buildNumber" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "appVersion=$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          & .\gradlew.bat :desktopApp:packageMsi :desktopApp:packageExe :desktopApp:createDistributable "-Pbitchord.version=$appVersion" --no-daemon
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect Artifacts
        shell: pwsh
        run: |
          $v = "${{ steps.build.outputs.releaseVersion }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          if (Test-Path desktopApp/build/compose/binaries/main/msi/*.msi) {
            Copy-Item desktopApp/build/compose/binaries/main/msi/*.msi "dist/BitChord-$v-windows-x64.msi"
          }
          if (Test-Path desktopApp/build/compose/binaries/main/exe/*.exe) {
            Copy-Item desktopApp/build/compose/binaries/main/exe/*.exe "dist/BitChord-$v-windows-x64-setup.exe"
          }
          if (Test-Path desktopApp/build/compose/binaries/main/app/BitChord) {
            7z a -tzip -mx=5 "dist/BitChord-$v-windows-x64-portable.zip" "desktopApp/build/compose/binaries/main/app/BitChord/*" | Out-Null
          }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-binaries
          path: dist/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.build.outputs.releaseVersion }}-windows"
          name: "BitChord v${{ steps.build.outputs.releaseVersion }} for Windows 10/11 (x64)"
          body: |
            Official BitChord v${{ steps.build.outputs.releaseVersion }} release for Windows 10 and Windows 11 (64-bit).
            Windows application build: ${{ steps.build.outputs.buildNumber || 'standard' }}.

            ### Included Packages:
            - **Setup Installer (.exe)**: `BitChord-${{ steps.build.outputs.releaseVersion }}-windows-x64-setup.exe` (Recommended)
            - **Windows Installer (.msi)**: `BitChord-${{ steps.build.outputs.releaseVersion }}-windows-x64.msi`
            - **Portable (.zip)**: `BitChord-${{ steps.build.outputs.releaseVersion }}-windows-x64-portable.zip` (Extract & play without installing)

            ### Features:
            - Native Windows System Media Transport Controls (SMTC)
            - Hi-Res Lossless Audio decoding with FFmpeg 7.1
            - DJ Automix, Crossfade & Liquid Glass desktop aesthetic
          files: dist/*
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
